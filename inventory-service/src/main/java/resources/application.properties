# -----------------------------
# ?? Server Configuration
# -----------------------------
server.port=8787

# -----------------------------
# ? Spring Cloud Stream (Kafka)
# -----------------------------
# Define the function that processes Kafka messages
spring.cloud.function.definition=process

# Bind the function input to Kafka topic: jobAddedToMachines
spring.cloud.stream.bindings.process-in-0.destination=jobAddedToMachines
spring.cloud.stream.bindings.process-in-0.group=inventory-group

# Kafka broker configuration (local instance)
spring.cloud.stream.kafka.binder.brokers=localhost:9092

# -----------------------------
# ? JSON Formatting
# -----------------------------
# Force pretty JSON output for API and stream responses
spring.jackson.serialization.indent_output=true

# -----------------------------
# ? Database (H2 - In Memory)
# -----------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:inventorydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -----------------------------
# ? Application Metadata
# -----------------------------
spring.application.name=inventory-service
logging.level.com.example=INFO
