# Kafka StreamBridge configuration
spring.cloud.stream.bindings.timesheetEvent-out-0.destination=timesheet-events
spring.cloud.stream.bindings.shiftPublished-out-0.destination=shift-published-events

# Kafka Consumer configuration - Listen to Business Management events
spring.cloud.stream.bindings.machineScheduleCreated-in-0.destination=machine-schedule-events
spring.cloud.stream.bindings.machineScheduleCreated-in-0.group=workforce-service-group

# Kafka binder configuration
spring.cloud.stream.kafka.binder.brokers=localhost:9092
spring.cloud.stream.kafka.binder.defaultBrokerPort=9092


spring.cloud.stream.defaultBinder=kafka

# Google Gemini Configuration (LangChain4j format)
langchain4j.google-ai-gemini.chat-model.api-key=AIzaSyB5BKWdVaycwco1SO7Dbm96kVLGP24Oi4A
langchain4j.google-ai-gemini.chat-model.model-name=gemini-2.0-flash
langchain4j.google-ai-gemini.chat-model.temperature=0.1
langchain4j.google-ai-gemini.chat-model.max-tokens=1000
langchain4j.google-ai-gemini.chat-model.timeout=PT60S
langchain4j.google-ai-gemini.chat-model.log-requests=true
langchain4j.google-ai-gemini.chat-model.log-responses=true

# Enable LangChain4j debug logging
logging.level.dev.langchain4j=DEBUG
logging.level.dev.langchain4j.model.googleai=DEBUG

# Logging Configuration
logging.level.root=INFO
logging.level.com.example=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Jackson Configuration
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC
