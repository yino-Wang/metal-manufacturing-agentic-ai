# Server Configuration
server.port=8080
spring.application.name=workforce-service

# Spring Cloud Configuration
spring.cloud.compatibility-verifier.enabled=false

window.size.ms=3600000

# Database Configuration
spring.datasource.url=jdbc:h2:mem:workforce_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=workforce-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Kafka Streams Configuration (required for InteractiveQuery bean)
windowstore.name=workforce-window-store
spring.kafka.streams.application-id=workforce-streams
spring.kafka.streams.bootstrap-servers=localhost:9092
spring.kafka.streams.default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
spring.kafka.streams.default.value.serde=org.apache.kafka.common.serialization.Serdes$StringSerde

# Google Gemini Configuration (LangChain4j format)
langchain4j.google-ai-gemini.chat-model.api-key=AIzaSyB5BKWdVaycwco1SO7Dbm96kVLGP24Oi4A
langchain4j.google-ai-gemini.chat-model.model-name=gemini-2.0-flash
langchain4j.google-ai-gemini.chat-model.temperature=0.1
langchain4j.google-ai-gemini.chat-model.max-tokens=1000
langchain4j.google-ai-gemini.chat-model.timeout=PT60S
langchain4j.google-ai-gemini.chat-model.log-requests=true
langchain4j.google-ai-gemini.chat-model.log-responses=true

# External Services Configuration
business.ms.base-url=http://localhost:8787

# Enable LangChain4j debug logging
logging.level.dev.langchain4j=DEBUG
logging.level.dev.langchain4j.model.googleai=DEBUG

# Logging Configuration
logging.level.root=INFO
logging.level.com.example=DEBUG
logging.level.org.springframework.kafka=WARN
logging.level.org.apache.kafka=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Jackson Configuration
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC
