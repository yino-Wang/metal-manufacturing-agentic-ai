# Test configuration to disable Kafka and use in-memory database
spring.kafka.enabled=false
spring.cloud.stream.kafka.binder.autoCreateTopics=false
spring.cloud.stream.bindings.machineScheduleCreated-in-0.destination=machine-schedule-events
spring.cloud.stream.bindings.machineScheduleCreated-in-0.group=workforce-group
spring.cloud.stream.kafka.binder.configuration.auto.offset.reset=earliest

# Disable Kafka for tests
#spring.cloud.stream.default-binder=test
#spring.autoconfigure.exclude=org.springframework.cloud.stream.binder.kafka.config.KafkaBinderConfiguration

# Use H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.example=DEBUG
logging.level.org.springframework.cloud.stream=ERROR
logging.level.org.apache.kafka=ERROR
