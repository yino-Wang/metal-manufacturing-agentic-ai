server.port=8787
spring.cloud.function.definition=process
spring.cloud.stream.bindings.process-in-0.destination=machineSchedulings
spring.cloud.stream.kafka.binder.brokers=localhost:9092
spring.cloud.stream.kafka.streams.binder.configuration.commit.interval.ms=500

windowstore.name=booking-windowstore
window.size.ms=30000

spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:testdb
spring.cloud.stream.bindings.machineScheduledChannel.destination=machineSchedulings
spring.cloud.stream.bindings.jobAddedToMachineChannel.destination=jobAddedToMachines
spring.cloud.stream.bindings.machineScheduleUpdatedChannel.destination=cargoroutings